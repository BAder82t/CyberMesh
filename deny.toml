# cargo-deny configuration: vulnerability advisories, licence policy, bans and sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` (RUSTSEC-2024-0436, unmaintained) used to be ignored here. It is gone: the vendored
  # if-watch (vendor/if-watch/VENDORED.md) uses the netlink 0.9 crates, which do not need it.
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
