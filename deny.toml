# cargo-deny configuration: vulnerability advisories, licence policy, bans and sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained (no known vulnerability). It is a compile-time proc-macro in the
  # Linux graph only: libp2p-tcp -> if-watch 3.2.2 -> netlink-packet-core 0.8.2.
  # Checked 2026-11-22: netlink-packet-core 0.9.0 and the matching 0.9 netlink releases
  # no longer depend on it, and libp2p/if-watch PR #55 moves if-watch to them (5 lines in
  # Cargo.toml), but if-watch has not merged it or released since 3.2.2. Tested on Linux
  # x86_64 (2026-11-22): with if-watch patched to that PR's commit, the whole workspace passes
  # `cargo check --all-targets --locked` and the cybermesh-network tests pass (11), so the
  # upgrade is expected to be safe once released. REMOVE THIS IGNORE
  # when a new if-watch release is taken (`cargo update -p if-watch`) and `cargo tree -i paste
  # --workspace --target all` finds nothing; `cargo deny` then warns that the ignore is unused.
  # Not worth a git patch or a fork of paste: see docs/roadmap.md.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time proc-macro via libp2p; no runtime code; waiting for an if-watch release on netlink 0.9" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
